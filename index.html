<style>
/* Layout: barra fixa (marca · abas · usuário · sync) · conteúdo da aba: Prospecção (resumo, listas, filtros, tabela), Dashboard (gestão), Equipe e listas */
:root{
  --bg:#F3F7FA; --surface:#FFFFFF; --sunk:#E8EFF4; --line:#D5E1EA;
  --ink:#0F2A3D; --muted:#5A7182; --brand:#72B7DD; --brand-ink:#1C6E9C; --brand-soft:#E3F1F9;
  --ok:#1E8A55; --ok-soft:#E1F3E9; --warn:#B26A00; --warn-soft:#FFF1D9; --bad:#C2372F; --bad-soft:#FBE4E2;
  --f-display:"Archivo","Segoe UI",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1922; --surface:#13232F; --sunk:#0A141B; --line:#22394A; --ink:#E4EEF4; --muted:#8FA6B6; --brand:#72B7DD; --brand-ink:#8CCBEE; --brand-soft:#173447;
  --ok:#4CC488; --ok-soft:#143326; --warn:#F0A63A; --warn-soft:#3A2A10; --bad:#F07A71; --bad-soft:#3B1B19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1922; --surface:#13232F; --sunk:#0A141B; --line:#22394A; --ink:#E4EEF4; --muted:#8FA6B6; --brand:#72B7DD; --brand-ink:#8CCBEE; --brand-soft:#173447;
  --ok:#4CC488; --ok-soft:#143326; --warn:#F0A63A; --warn-soft:#3A2A10; --bad:#F07A71; --bad-soft:#3B1B19; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1480px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.logo .pc{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.logo small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--brand-soft);color:var(--brand-ink)}
.spacer{flex:1}
.me{font-size:13px;color:var(--muted)}.me b{color:var(--ink)}
.role{font-size:11px;padding:2px 6px;border-radius:4px;background:var(--ink);color:var(--surface);margin-left:6px;letter-spacing:.04em}
select,input[type=search],input[type=date],input[type=text],input[type=tel],input[type=email],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,[role=button]:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.dot.on{background:var(--ok)}.dot.off{background:var(--warn)}
main{padding-block:16px 40px;display:grid;gap:16px}
h2{font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h3{font-family:var(--f-display);font-size:16px;margin:0}
.sec{display:grid;gap:8px}
.sechead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--brand-ink);border-color:var(--brand-ink);color:#fff}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:left;cursor:pointer;color:inherit;font:inherit}
.kpi b{display:block;font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.goal{cursor:default}.kpi.goal b{color:var(--brand-ink)}.kpi.alert b{color:var(--bad)}
.bar{height:5px;border-radius:3px;background:var(--sunk);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.lst{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:5px;cursor:pointer;text-align:left}
.lst[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft) inset}
.lst .seg{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-ink);font-weight:600}
.lst .nm{font-weight:600;font-size:13px;line-height:1.25}
.lst .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok)}
.owner{font-size:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input[type=search]{flex:1 1 220px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.count{font-size:13px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:28px minmax(0,2.3fr) minmax(0,1.2fr) 34px minmax(0,1.5fr) minmax(0,1.3fr) 150px 130px 130px;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.row.head{border-top:0;background:var(--sunk);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.row.due{box-shadow:3px 0 0 var(--bad) inset}.row.won{background:var(--ok-soft)}.row.dead{opacity:.6}
.exp{width:24px;height:24px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;color:var(--muted);font-size:13px;line-height:1}
.nm1{font-weight:600;overflow-wrap:anywhere}
.sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--brand-soft);color:var(--brand-ink);font-weight:600;margin-right:4px;white-space:nowrap}
.tag.new{background:var(--warn-soft);color:var(--warn)}
.prio{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font-family:var(--f-display);font-weight:800;font-size:13px}
.prio.A{background:var(--ink);color:var(--surface)}.prio.B{background:var(--brand-soft);color:var(--brand-ink)}.prio.C{background:var(--sunk);color:var(--muted)}
.phone{display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums;font-size:13px}
.phone a{color:var(--ok);font-weight:600;text-decoration:none}.phone a:hover{text-decoration:underline}
.phone .fx{color:var(--muted)}.nophone{font-size:12px;color:var(--warn)}
.cp{border:0;background:none;color:var(--muted);cursor:pointer;font-size:11px;padding:0 0 0 4px}
.ctc{font-size:12px;overflow-wrap:anywhere}
.row select,.row input[type=date]{width:100%;font-size:13px;padding:5px 6px}
.detail{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 18px;padding:10px 0 6px 38px;font-size:13px;margin:0}
.detail dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.detail dd{margin:2px 0 0;overflow-wrap:anywhere}
.detail .full{grid-column:1/-1}
.detail textarea{width:100%;min-height:56px;resize:vertical}
.detail input{width:100%}
.detail a{color:var(--brand-ink)}
.who{font-size:12px;color:var(--muted)}
.more{display:block;margin:12px auto 0}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}
.form label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.form .full{grid-column:1/-1}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
table.t td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t tr.tot td{font-weight:700;border-bottom:0}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:12px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.hbar{display:grid;grid-template-columns:150px minmax(0,1fr) 52px;gap:8px;align-items:center;font-size:13px}
.hbar .tr{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden}.hbar .tr i{display:block;height:100%;background:var(--brand)}
.hbar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.days{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;align-items:end;height:120px;padding-top:6px}
.days .d{display:grid;grid-template-rows:1fr auto auto;gap:3px;height:100%;text-align:center;font-size:10px;color:var(--muted)}
.days .d i{align-self:end;display:block;background:var(--brand);border-radius:3px 3px 0 0;min-height:2px}
.days .d b{font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums}
.login{max-width:460px;margin:40px auto;display:grid;gap:14px}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.names button{padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:15px;cursor:pointer;text-align:left}
.names button:disabled{opacity:.45;cursor:not-allowed}
.names button small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 12px}
.map label{display:grid;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.prev{font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.mobl{display:none}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:900px){
  .row.head{display:none}
  .row{grid-template-columns:28px minmax(0,1fr) 34px}
  .row>.c-cat,.row>.c-phone,.row>.c-ctc,.row>.c-st,.row>.c-fu,.row>.c-ow{grid-column:2/-1}
  .mobl{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
  .row>.c-prio{grid-column:3;grid-row:1}
  .detail,.form{grid-template-columns:minmax(0,1fr);padding-left:0}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .map{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.hbar{grid-template-columns:96px minmax(0,1fr) 44px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<style>

.login .lg{display:grid;gap:10px}
.login label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.err{color:var(--bad);font-size:13px;min-height:18px}
.logo img{height:40px;width:auto;display:block}
.lgdiv{border-left:1px solid var(--line);padding-left:12px}
.loginlogo{display:block;height:84px;width:auto;margin:4px auto 6px}

.row.locked{background:var(--sunk)}.row.locked .nm1{color:var(--muted)}

.vend{display:flex;flex-wrap:wrap;gap:6px}
.vchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;background:var(--surface)}
.vchip:has(input:checked){background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.vacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#vAdm table.t td{white-space:normal}
#vRobo[hidden]{display:none!important}
.robo-k{grid-template-columns:repeat(4,minmax(0,1fr))}
.robo textarea{width:100%;resize:vertical;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
#vRobo input[type=number],#vRobo input[type=url],#vRobo input[type=password],#vRobo .form input[type=text],#vRobo .form input[type=tel],#vRobo .form select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
#vRobo label.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:500}
#vRobo label.chk input{width:18px;height:18px;accent-color:var(--brand-ink)}
#vRobo .inl{display:flex;gap:6px;align-items:center}#vRobo .inl input{flex:1}
#vRobo td.wrap{white-space:normal;text-align:left;min-width:260px}
#vRobo .t th:last-child{text-align:left}
#vRobo .camps{display:grid;gap:12px}#vRobo .camp{border-left:3px solid var(--brand)}#vRobo .tel-test{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600;max-width:320px}
.okt{color:var(--ok)!important}.badt{color:var(--bad)!important}
@media (max-width:620px){.robo-k{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

<script>
const CFGX=window.PROSP_CONFIG||{};const URL_API=(CFGX.SCRIPT_URL||'').trim();const DEMO=!URL_API;
const META=Number(CFGX.META_DIARIA||10);
const STS=['Não contatado','1º contato feito','Respondeu','Visita agendada','Orçamento enviado','Negociando','Fechado','Sem interesse','Contato inválido'];
const SEGS=['Clientes da loja','Food service','Escolas públicas','Escolas particulares','Igrejas','Supermercados','Hotéis e pousadas','Indústria','Outros'];
const FIELDS=[['n','Nome'],['t','Tipo / categoria'],['c','Cidade'],['b','Bairro'],['w','Celular / WhatsApp'],['f','Telefone fixo'],['e','E-mail'],['ig','Instagram'],['ct','Contato (nome / cargo)'],['a','Endereço'],['p','Prioridade (A, B ou C)'],['o','Observações']];
const $=s=>document.querySelector(s);
function el(t,a,...ch){const e=document.createElement(t);if(a)for(const k in a){if(k==='text')e.textContent=a[k];else if(a[k]!=null&&a[k]!==false)e.setAttribute(k,a[k])}ch.flat().forEach(c=>{if(c!=null&&c!==false)e.append(c)});return e}
const day=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>day();
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove('show'),2000)}
function copy(t){try{navigator.clipboard.writeText(t).then(()=>toast('Copiado'),()=>toast(t))}catch(e){toast(t)}}
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function fmtPhone(p){p=String(p||'').trim();if(!p)return '';const m=p.match(/^\+55\s?(\d{2})\s?(.+)$/);if(m)return '('+m[1]+') '+m[2];const dg=p.replace(/\D/g,'');
  if(p.includes('('))return p;if(dg.length===13&&dg.startsWith('55'))return '('+dg.slice(2,4)+') '+dg.slice(4,9)+'-'+dg.slice(9);if(dg.length===11)return '('+dg.slice(0,2)+') '+dg.slice(2,7)+'-'+dg.slice(7);if(dg.length===10)return '('+dg.slice(0,2)+') '+dg.slice(2,6)+'-'+dg.slice(6);return p}
function waLink(n,d){const dg=String(n).replace(/\D/g,'');if(dg.length<10)return null;const txt=(CFGX.MENSAGEM||'').replace('{nome}',d?d.n:'').replace('{vendedor}',ME.nome||'');return 'https://wa.me/'+(dg.startsWith('55')&&dg.length>11?dg:'55'+dg)+(txt?'?text='+encodeURIComponent(txt):'')}
function isCell(n){const dg=String(n||'').replace(/\D/g,'').replace(/^55(?=\d{11}$)/,'');return dg.length===11&&dg[2]==='9'}

/* ================= API (planilha) ou DEMO (navegador) ================= */
let TOKEN=ls.get('pc-token','');
async function call(action,payload){
  if(DEMO)return demoCall(action,payload);
  const r=await fetch(URL_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:TOKEN},payload||{}))});
  const j=await r.json();if(!j.ok){if(j.erro==='SESSAO_EXPIRADA'){logout(true);throw new Error('Sua sessão expirou. Entre de novo.')}throw new Error(j.erro||'Erro')}return j;
}
// ----- modo demonstração -----
let DEMOD=null;
function loadDemoJs(){return new Promise((res,rej)=>{if(window.DEMO_DATA)return res(window.DEMO_DATA);const s=document.createElement('script');s.src='demo.js';s.onload=()=>window.DEMO_DATA?res(window.DEMO_DATA):rej();s.onerror=rej;document.head.append(s)})}
async function demoData(){if(DEMOD)return DEMOD;let base;try{base=await loadDemoJs()}catch(e){try{base=await fetch('demo.json').then(r=>r.json())}catch(x){throw new Error('Não achei o arquivo demo.js. Deixe-o na mesma pasta do index.html.')}}const saved=ls.get('pc-demo',null);
  DEMOD=saved||{listas:base.listas,leads:base.leads,atividade:[],equipe:['João','Rafa','José','Marcela','Pedro'].map(n=>({nome:n,perfil:n==='Pedro'?'Gestão':'Vendedor'}))};return DEMOD}
function demoSave(){ls.set('pc-demo',DEMOD)}
async function demoCall(a,p){const D=await demoData();const u=ls.get('pc-demo-user',null);
  if(a==='login'){if(String(p.pin).trim()!=='1234')throw new Error('PIN incorreto. No modo demonstração (sem a planilha ligada) o PIN de todos é 1234.');const e=D.equipe.find(x=>x.nome===p.nome);ls.set('pc-demo-user',e);return {ok:true,token:'demo',nome:e.nome,perfil:e.perfil}}
  if(!u)throw new Error('Entre primeiro');
  if(a==='load'||a==='changes'){const LM={};D.listas.forEach(l=>LM[l.id]=l);const g=u.perfil==='Gestão';const vis=D.leads.filter(d=>g||d.ow===u.nome||donos(LM[d.l]).includes(u.nome));const ids=new Set(vis.map(d=>d.l));
    return {ok:true,eu:u,equipe:D.equipe,listas:D.listas.filter(l=>g||donos(l).includes(u.nome)||ids.has(l.id)),leads:vis,ids:a==='changes'?vis.map(d=>d.k):undefined,atividade:D.atividade.filter(x=>g||x.by===u.nome),agora:Date.now()}}
  if(a==='update'){const d=D.leads.find(x=>x.k===p.id);if(!d)throw new Error('Lead não encontrado');const cur=Object.assign({},d);const fx=Object.assign({},p.fields);if(u.perfil!=='Gestão'){if(cur.ow&&cur.ow!==u.nome)throw new Error('Este lead está com '+cur.ow);delete fx.ow;if(!cur.ow)fx.ow=u.nome}Object.assign(d,fx);
    if(('w2' in p.fields&&d.w2&&!cur.w2&&!cur.w)||('w' in p.fields&&d.w&&!cur.w&&!cur.w2&&!cur.wgby)){d.wgby=u.nome;d.wgday=today()}
    if('igst' in p.fields&&d.igst!==(cur.igst||''))d.igday=today();
    let contou=false;if(p.contact&&cur.cd!==today()){d.cd=today();contou=true;if(!d.st||d.st==='Não contatado')d.st='1º contato feito';D.atividade.push({day:today(),by:u.nome,k:d.k,l:d.l,acao:'Contato',st:d.st})}

  if(!bar){bar=el('div',{id:'metaBar',role:'status'});const hd=document.querySelector('header.top');if(hd)hd.after(bar);else document.body.prepend(bar);
    document.head.append(el('style',{text:'#metaBar{position:sticky;top:0;z-index:50;padding:12px 16px;font:600 15px/1.35 system-ui,sans-serif;text-align:center;color:#fff}#metaBar.red{background:#c62828;animation:mbPulse 1.6s ease-in-out infinite}#metaBar.orange{background:#e07b00}#metaBar.green{background:#1a7f37}#metaBar small{display:block;font-weight:400;font-size:13px;opacity:.95;margin-top:2px}#metaBar .mbt{display:block;height:6px;background:rgba(255,255,255,.3);border-radius:4px;margin:8px auto 0;max-width:520px;overflow:hidden}#metaBar .mbt i{display:block;height:100%;background:#fff}@keyframes mbPulse{0%,100%{box-shadow:inset 0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:inset 0 0 0 4px rgba(255,255,255,.55)}}'}))}
  const now=new Date(),dw=now.getDay(),h=now.getHours()+now.getMinutes()/60;
  if(dw===0||dw===6){bar.hidden=true;return}
  const esp=Math.min(META,Math.ceil(META*Math.max(0,Math.min(1,(h-8)/9))));
  if(isG()){const nomes=EQUIPE.filter(x=>x.perfil!=='Gestão'&&x.nome!==ME.nome).map(x=>x.nome);const cnt=n=>ACT.filter(a=>a.day===today()&&a.by===n&&a.acao==='Contato').length;
    const abaixo=nomes.map(n=>[n,cnt(n)]).filter(([n,c])=>c<esp);
    if(!nomes.length||!abaixo.length){bar.className='green';bar.replaceChildren(el('span',{text:'✅ Equipe no ritmo da meta de '+META+' contatos/dia'}));bar.hidden=false;return}
    bar.className='red';bar.replaceChildren(el('span',{text:'⚠️ '+abaixo.length+' vendedor(es) abaixo da meta de hoje'}),el('small',{text:abaixo.map(([n,c])=>n+' '+c+'/'+META).join(' · ')+' — esperado até agora: '+esp}));bar.hidden=false;return}
  const mine=myToday(),falta=Math.max(0,META-mine),pct=Math.min(100,Math.round(mine/META*100));
  const trilha=el('span',{class:'mbt'},el('i',{style:'width:'+pct+'%'}));
  if(mine>=META){bar.className='green';bar.replaceChildren(el('span',{text:'✅ Meta batida! '+mine+' de '+META+' contatos hoje'}),trilha)}
  else if(mine<esp){bar.className='red';bar.replaceChildren(el('span',{text:'⚠️ META NÃO ATINGIDA — você fez '+mine+' de '+META+' contatos hoje'}),el('small',{text:'Faltam '+falta+'. Pelo horário, já deveria ter pelo menos '+esp+'. Bora prospectar!'}),trilha)}
  else{bar.className='orange';bar.replaceChildren(el('span',{text:'🎯 Meta do dia: '+mine+' de '+META+' contatos'}),el('small',{text:'Faltam '+falta+' — você está no ritmo, continue.'}),trilha)}
  bar.hidden=false}
setInterval(()=>{try{metaBar()}catch(e){}},15000);
function render(){ls.set('pc-f3',F);try{metaBar()}catch(e){}if(view==='pros')renderPros();else if(view==='dash')renderDash();else if(view==='adm')renderAdm();else if(view==='robo')renderRobo()}
function setView(v){if(v!=='pros'&&!isG())v='pros';view=v;document.querySelectorAll('#tabs [role=tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===v)));$('#vPros').hidden=v!=='pros';$('#vDash').hidden=v!=='dash';$('#vAdm').hidden=v!=='adm';$('#vRobo').hidden=v!=='robo';if(v==='robo')AUTO=null;render()}
function syncUI(){cities();$('#q').value=F.q;$('#fPrio').value=F.p;$('#fSt').value=F.st;$('#fOw').value=F.ow;[['#fW','w'],['#fNoW','now'],['#fDue','due'],['#fMine','mine']].forEach(([s,k])=>$(s).setAttribute('aria-pressed',String(!!F[k])))}
function setSync(c,t){$('#dot').className='dot '+(c==='busy'?'':c);$('#syncTxt').textContent=t}
document.querySelectorAll('#tabs [role=tab]').forEach(b=>b.onclick=()=>setView(b.dataset.v));
STS.forEach(s=>$('#fSt').append(el('option',{value:s,text:s})));
let qt;$('#q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{F.q=e.target.value;page=100;render()},180)};
$('#fCity').onchange=e=>{F.c=e.target.value;page=100;render()};$('#fPrio').onchange=e=>{F.p=e.target.value;page=100;render()};$('#fSt').onchange=e=>{F.st=e.target.value;page=100;render()};$('#fOw').onchange=e=>{F.ow=e.target.value;page=100;render()};
$('#fW').onclick=()=>{F.w=!F.w;if(F.w)F.now=false;syncUI();render()};$('#fNoW').onclick=()=>{F.now=!F.now;if(F.now)F.w=false;syncUI();render()};$('#fDue').onclick=()=>{F.due=!F.due;syncUI();render()};$('#fMine').onclick=()=>{F.mine=!F.mine;syncUI();render()};
$('#more').onclick=()=>{page+=100;render()};$('#bNew').onclick=openNew;$('#bImp').onclick=openImp;$('#bOut').onclick=()=>logout(false);

/* ================= login / carga ================= */
function showLogin(msg){$('#vLogin').hidden=false;$('#vPros').hidden=true;$('#vDash').hidden=true;$('#vAdm').hidden=true;$('#vRobo').hidden=true;$('#tabs').hidden=true;$('#bOut').hidden=true;$('#meBox').textContent='';
  const s=$('#lgNome');s.replaceChildren(el('option',{value:'',text:'Escolha'}));(EQUIPE.length?EQUIPE.map(x=>x.nome):(ls.get('pc-nomes',null)||['João','Rafa','José','Marcela','Pedro','Agência Peso Certo'])).forEach(n=>s.append(el('option',{value:n,text:n})));
  $('#lgErr').textContent=msg||'';$('#lgHint').textContent=DEMO?'MODO DEMONSTRAÇÃO · PIN de todos: 1234. Os dados ficam só neste navegador. Os PINs da planilha passam a valer depois de colar a URL do Apps Script no config.js.':'Seu PIN está na aba Equipe da planilha; peça ao Pedro.';setSync('',DEMO?'Demonstração':'')}
function logout(expired){TOKEN='';ME={};ls.del('pc-token');ls.del('pc-me');ls.del('pc-demo-user');loaded=false;showLogin(expired?'Sua sessão expirou. Entre de novo.':'')}
$('#fLogin').onsubmit=async e=>{e.preventDefault();const b=$('#lgBtn');b.disabled=true;b.textContent='Entrando…';$('#lgErr').textContent='';
  try{const j=await call('login',{nome:$('#lgNome').value,pin:$('#lgPin').value});TOKEN=j.token;ME={nome:j.nome,perfil:j.perfil};ls.set('pc-token',TOKEN);ls.set('pc-me',ME);$('#lgPin').value='';await start()}
  catch(err){$('#lgErr').textContent=err.message||'Não consegui entrar'}finally{b.disabled=false;b.textContent='Entrar'}};
async function reload(){const j=await call('load');setData(j,true);loaded=true;render()}
let poll=null;
async function start(){$('#vLogin').hidden=true;$('#tabs').hidden=false;$('#bOut').hidden=false;
  $('#meBox').replaceChildren('Olá, ',el('b',{text:ME.nome}),isG()?el('span',{class:'role',text:'GESTÃO'}):'');
  document.querySelector('[data-v=dash]').hidden=!isG();document.querySelector('[data-v=adm]').hidden=!isG();document.querySelector('[data-v=robo]').hidden=!isG();$('#bImp').hidden=!isG();
  $('#fOw').hidden=!isG();if(!isG())F.ow='';
  setView(isG()&&view!=='pros'?view:'pros');setSync('','Carregando a planilha…');
  try{const j=await call('load');ME=j.eu||ME;setData(j,true);loaded=true;syncUI();render();setSync('on',DEMO?'Demonstração (dados neste navegador)':'Conectado à planilha')}
  catch(e){setSync('off',e.message);$('#list').replaceChildren(el('div',{class:'empty',text:'Não consegui carregar a planilha: '+e.message}));return}
  clearInterval(poll);if(!DEMO)poll=setInterval(async()=>{if(document.hidden||!TOKEN)return;
    try{const j=await call('changes',{since:SINCE-5000});const a=document.activeElement;setData(j,false);if(view!=='robo'&&!(a&&a.closest&&a.closest('#list,#newCard,#impCard')&&a.matches('textarea,input,select')))render();setSync('on','Atualizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}))}catch(e){setSync('off','Sem conexão com a planilha')}},Math.max(20,Number(CFGX.ATUALIZAR_A_CADA_SEGUNDOS||60))*1000)}
if(DEMO){$('#ro').textContent='Modo demonstração: falta colar a URL da planilha no config.js. Nada do que for feito aqui chega no time.';$('#ro').hidden=false}
(async()=>{if(TOKEN&&ME.nome){await start()}else showLogin()})();
</script>
